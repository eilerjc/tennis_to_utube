[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis_to_utube"
version = "0.1.0"
description = "Mark tennis match video, losslessly trim/join it, and export YouTube chapters and event links."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
gui = ["PySide6>=6.6", "python-mpv>=1.0"]
overlay = ["Pillow>=10.1"]

[project.gui-scripts]
tennis-to-utube = "tennis_to_utube.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "ffmpeg: needs ffmpeg/ffprobe with libx265 on PATH (skipped otherwise)",
    "gui: needs PySide6 (skipped otherwise); runs offscreen",
]
