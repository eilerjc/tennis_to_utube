[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis_to_utube"
version = "0.1.0"
description = "Mark tennis match video, losslessly trim/join it, and export YouTube chapters and event links."
readme = "DESIGN.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "ffmpeg: needs ffmpeg/ffprobe with libx265 on PATH (skipped otherwise)",
]
